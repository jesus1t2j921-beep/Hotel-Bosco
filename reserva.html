<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva</title>
</head>
<body>
    <h1>Haga su reserva</h1>
    <form action="procesareserva.php" method="get">
        <fieldset>
        <legend>Datos personales</legend>
        <p>
        <label for="name">Nombre:</label>
        <input type="text" name="nombre" required maxlength="100" autofocus>
        </p>
        <p>
        <label for="apellidos">Apellidos:</label>
        <input type="text" name="apellidos" required maxlength="100">
        </p>
        <label for="DNI">DNI:</label>
        <input type="text" name="DNI" required maxlength="10"
        placeholder="DNI con letra">
        </fieldset>
        <fieldset>
        <legend>Datos de su estancia</legend>
        Habitacion:
        <p>
        <input type="radio" name="tipo" value="I">Individual
        </p>
        <p>
        <input type="radio" name="tipo" value="D">Doble
        </p>
        <p>
        <input type="radio" name="tipo" value="T">Triple
        </p>
        Numero de personas:
        <select name="numero">
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
        </select>
        <p>
        <input type="checkbox" name="mascotas"> Llevo mascotas:
        </p>
        <p>
        Fecha de llegada <input type="date" name="fecha_llegada">
        </p>
        <p>
        Hora de llegada <input type="time" name="hora_llegada">
        </p>
        <input type="submit" value="Enviar">
        <input type="reset" value="Reiniciar">
        <p>
        <a href="index.html" target="_self">Volver</a>
        </p>
        </fieldset>
    </form>
</body>
</html>
